<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#545f47">
<title>គ្រប់គ្រង | Chankrisna &amp; Sreylak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Battambang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f0e7;--olive:#545f47;--olive-d:#454f3a;--sage:#8b9a7c;--ink:#3d4635;--muted:#6f7865;--line:rgba(84,95,71,.2);--gold:#b39a62;--red:#a0483a}
*{box-sizing:border-box}
body{margin:0;font-family:'Battambang',sans-serif;background:#e7e2d6;color:var(--ink);min-height:100vh}
header{background:var(--olive);color:#f1ede2;padding:18px 18px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-family:'Cormorant Garamond',serif;letter-spacing:.2em;font-size:1.1rem;text-transform:uppercase;font-weight:600}
header .sub{font-size:.75rem;opacity:.75}
nav{display:flex;gap:4px;margin-top:12px}
nav a{padding:10px 16px;border-radius:10px 10px 0 0;color:#f1ede2;text-decoration:none;font-size:.86rem;opacity:.75}
nav a[aria-current]{background:#e7e2d6;color:var(--olive);opacity:1;font-weight:700}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--gold);color:#fff;font-size:.7rem;text-align:center}
.badge:empty{display:none}
main{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:.95rem;color:var(--olive)}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:.88rem;color:var(--ink)}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:170px 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer}
.b{padding:9px 16px;border-radius:999px;border:1px solid var(--olive);background:var(--olive);color:#f1ede2;font-size:.82rem}
.b:hover{background:var(--olive-d)}
.b.o{background:transparent;color:var(--olive)}
.b.o:hover{background:rgba(84,95,71,.08)}
.b.r{border-color:var(--red);background:transparent;color:var(--red)}
.b.s{padding:6px 12px;font-size:.76rem}
.b:disabled{opacity:.5;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.out{margin-top:12px;padding:12px;border-radius:10px;background:#fff;border:1px dashed var(--sage);display:none}
.out.on{display:block}
.out code{display:block;word-break:break-all;font-size:.82rem;margin:4px 0 8px;color:var(--olive)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.item .id{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--gold);min-width:30px}
.item .nm{font-size:.88rem;word-break:break-word}
.item .nm small{display:block;color:var(--muted);font-size:.72rem}
.item .ab{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.item{grid-template-columns:auto 1fr}.item .ab{grid-column:1/-1;justify-content:flex-start}}
.wish{padding:12px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.wish .n{font-weight:700;color:var(--olive);font-size:.86rem}
.wish .m{white-space:pre-wrap;word-break:break-word;font-size:.86rem;margin:4px 0}
.wish .t{font-size:.7rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:.84rem;padding:14px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.top input{max-width:260px}
.count{font-size:.8rem;color:var(--muted)}
#gate{max-width:380px;margin:12vh auto;padding:0 18px}
#gate .card{text-align:center;padding:26px}
#gate h1{font-family:'Cormorant Garamond',serif;letter-spacing:.2em;color:var(--olive);margin:0 0 4px;font-size:1.3rem}
.msg{font-size:.8rem;min-height:1.2em;margin-top:8px;color:var(--red)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--olive);color:#fff;padding:10px 18px;border-radius:999px;font-size:.84rem;transition:transform .3s,visibility .3s;z-index:20;visibility:hidden}
#toast.on{transform:translateX(-50%);visibility:visible}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>C | S</h1>
    <div style="font-size:.85rem;color:var(--muted);margin-bottom:16px">ទំព័រគ្រប់គ្រងកម្មវិធីមង្គលការ</div>
    <form id="gateForm">
      <input type="password" id="key" placeholder="ពាក្យសម្ងាត់ (ADMIN_KEY)" autocomplete="current-password" required>
      <div class="acts" style="justify-content:center"><button class="b" type="submit">ចូល</button></div>
      <div class="msg" id="gateMsg"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>Chankrisna &amp; Sreylak</h1>
    <div class="sub">ទំព័រគ្រប់គ្រង · <a href="#" id="logout" style="color:inherit">ចាកចេញ</a></div>
    <nav>
      <a href="#guests" data-tab="guests">ភ្ញៀវធៀប</a>
      <a href="#wishes" data-tab="wishes">ពាក្យជូនពរ<span class="badge" id="wBadge"></span></a>
    </nav>
  </header>

  <main>
    <!-- ===== guests ===== -->
    <section id="tab-guests">
      <div class="card">
        <h2>បង្កើត link ធៀបសម្រាប់ភ្ញៀវ</h2>
        <form id="addForm">
          <div class="row">
            <div><label for="hon">គោរមងារ</label>
              <select id="hon">
                <option value="">— គ្មាន —</option>
                <option>លោក</option><option>លោកស្រី</option><option>លោក លោកស្រី</option><option>អ្នកនាង</option><option>កញ្ញា</option>
                <option>ឯកឧត្តម</option><option>លោកជំទាវ</option><option>ឯកឧត្តម លោកជំទាវ</option><option>លោកឧកញ៉ា</option>
                <option>លោកគ្រូ</option><option>អ្នកគ្រូ</option><option>បងប្អូន</option><option>សម្លាញ់</option>
                <option>Mr.</option><option>Ms.</option><option>Mrs.</option><option>Mr. &amp; Mrs.</option>
              </select></div>
            <div><label for="gname">ឈ្មោះភ្ញៀវ</label><input id="gname" maxlength="80" placeholder="ឧ. សុខ ចាន់ធី" required></div>
          </div>
          <div class="acts"><button class="b" type="submit" id="addBtn">បង្កើត link</button></div>
        </form>
        <div class="out" id="out">
          <div style="font-size:.8rem;color:var(--muted)">Link សម្រាប់ <b id="outName"></b></div>
          <code id="outLink"></code>
          <div class="acts">
            <button class="b s" type="button" id="cpLink">ចម្លង link</button>
            <button class="b s o" type="button" id="cpMsg">ចម្លងសារអញ្ជើញ</button>
            <button class="b s o" type="button" id="shareBtn" hidden>ចែករំលែក</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>បន្ថែមច្រើនឈ្មោះក្នុងពេលតែមួយ</h2>
        <label for="bulk">មួយបន្ទាត់ មួយឈ្មោះ (គោរមងារខាងលើនឹងប្រើសម្រាប់ទាំងអស់)</label>
        <textarea id="bulk" rows="4" placeholder="សុខ ចាន់ធី&#10;កែវ សុភា&#10;..."></textarea>
        <div class="acts"><button class="b o" type="button" id="bulkBtn">បន្ថែមទាំងអស់</button><span class="count" id="bulkSt"></span></div>
      </div>

      <div class="card">
        <div class="top"><h2 style="margin:0">បញ្ជីភ្ញៀវ <span class="count" id="gCount"></span></h2><input id="gSearch" placeholder="ស្វែងរក..."></div>
        <div class="list" id="gList"></div>
      </div>
    </section>

    <!-- ===== wishes ===== -->
    <section id="tab-wishes" hidden>
      <div class="card">
        <h2>រង់ចាំអនុម័ត <span class="count" id="pCount"></span></h2>
        <div class="count" id="modNote" style="margin:-4px 0 10px"></div>
        <div class="list" id="pList"></div>
      </div>
      <div class="card">
        <h2>កំពុងបង្ហាញលើធៀប <span class="count" id="lCount"></span></h2>
        <div class="list" id="lList"></div>
      </div>
    </section>
  </main>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = '';
  try { KEY = sessionStorage.getItem('adminKey') || ''; } catch (e) {}

  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { el.classList.remove('on'); }, 2200); }
  function api(path, body) {
    var o = { headers: { 'x-admin-key': KEY } };
    if (body) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fetch(path, o).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 403) { logout('ពាក្យសម្ងាត់មិនត្រឹមត្រូវ (ឬព្យាយាមខុសច្រើនដងពេក)'); throw new Error('key'); }
        if (r.status === 503) { toast('មិនទាន់ភ្ជាប់ Database (Upstash Redis)'); throw new Error('db'); }
        if (!r.ok || d.ok === false) { toast('មានបញ្ហា សូមព្យាយាមម្តងទៀត'); throw new Error('x'); }
        return d;
      });
    });
  }
  function copy(t) {
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('បានចម្លង ✓'); }, function () {
      var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('បានចម្លង ✓'); } catch (e) { prompt('ចម្លង:', t); } ta.remove();
    });
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function btn(txt, cls, fn) { var b = el('button', 'b s ' + (cls || ''), txt); b.type = 'button'; b.onclick = fn; return b; }
  function when(t) { return new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }

  /* ---------- login ---------- */
  function logout(msg) {
    KEY = ''; try { sessionStorage.removeItem('adminKey'); } catch (e) {}
    $('app').hidden = true; $('gate').hidden = false; $('gateMsg').textContent = msg || '';
  }
  $('logout').onclick = function (e) { e.preventDefault(); logout(); };
  $('gateForm').onsubmit = function (e) {
    e.preventDefault(); KEY = $('key').value.trim(); $('gateMsg').textContent = '';
    api('/api/guest?list=1').then(function (d) {
      try { sessionStorage.setItem('adminKey', KEY); } catch (e) {}
      $('key').value = ''; start(d);
    }).catch(function () {});
  };
  function start(first) {
    $('gate').hidden = true; $('app').hidden = false;
    if (first) renderGuests(first.guests); else loadGuests();
    loadWishes(); route();
  }

  /* ---------- tabs ---------- */
  function route() {
    var t = location.hash === '#wishes' ? 'wishes' : 'guests';
    $('tab-guests').hidden = t !== 'guests'; $('tab-wishes').hidden = t !== 'wishes';
    document.querySelectorAll('[data-tab]').forEach(function (a) { if (a.dataset.tab === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (!$('app').hidden) { if (t === 'wishes') loadWishes(); else loadGuests(); }
  }
  window.addEventListener('hashchange', route);

  /* ---------- guests ---------- */
  var GUESTS = [];
  function link(id) { return location.origin + '/#g=' + id; }
  function inviteText(g) {
    return 'សូមគោរពអញ្ជើញ ' + ((g.hon ? g.hon + ' ' : '') + g.name) + ' ចូលរួមពិធីមង្គលការរបស់យើងខ្ញុំ វ៉ាន ច័ន្ទគ្រឹស្នា & មិន ស្រីលក្ខ ថ្ងៃទី២១-២២ ខែវិច្ឆិកា ឆ្នាំ២០២៦ 🌿\n' + link(g.id);
  }
  function loadGuests() { return api('/api/guest?list=1').then(function (d) { renderGuests(d.guests); }).catch(function () {}); }
  function renderGuests(rows) {
    GUESTS = rows || []; drawGuests();
  }
  function drawGuests() {
    var f = $('gSearch').value.trim().toLowerCase(), box = $('gList'); box.innerHTML = '';
    var rows = GUESTS.filter(function (g) { return !f || (g.hon + ' ' + g.name).toLowerCase().indexOf(f) > -1 || String(g.id) === f; }).slice().reverse();
    $('gCount').textContent = '(' + GUESTS.length + ')';
    if (!rows.length) { box.appendChild(el('div', 'empty', GUESTS.length ? 'រកមិនឃើញ' : 'មិនទាន់មានភ្ញៀវ')); return; }
    rows.forEach(function (g) {
      var it = el('div', 'item');
      it.appendChild(el('div', 'id', '#' + g.id));
      var nm = el('div', 'nm', (g.hon ? g.hon + ' ' : '') + g.name); nm.appendChild(el('small', null, link(g.id)));
      it.appendChild(nm);
      var ab = el('div', 'ab');
      ab.appendChild(btn('ចម្លង', '', function () { copy(link(g.id)); }));
      ab.appendChild(btn('សារ', 'o', function () { copy(inviteText(g)); }));
      ab.appendChild(btn('លុប', 'r', function () {
        if (!confirm('លុប ' + g.name + '? (link ដែលផ្ញើរួចនឹងបង្ហាញ "ភ្ញៀវកិត្តិយស" វិញ)')) return;
        api('/api/guest', { op: 'del', id: g.id }).then(function () { toast('បានលុប'); loadGuests(); }).catch(function () {});
      }));
      it.appendChild(ab); box.appendChild(it);
    });
  }
  $('gSearch').oninput = drawGuests;

  var last = null;
  $('addForm').onsubmit = function (e) {
    e.preventDefault();
    var hon = $('hon').value, name = $('gname').value.trim(); if (!name) return;
    $('addBtn').disabled = true;
    api('/api/guest', { op: 'add', hon: hon, name: name }).then(function (d) {
      last = { id: d.id, hon: hon, name: name };
      $('outName').textContent = (hon ? hon + ' ' : '') + name;
      $('outLink').textContent = link(d.id);
      $('out').classList.add('on'); $('gname').value = ''; $('gname').focus();
      loadGuests();
    }).catch(function () {}).then(function () { $('addBtn').disabled = false; });
  };
  $('cpLink').onclick = function () { if (last) copy(link(last.id)); };
  $('cpMsg').onclick = function () { if (last) copy(inviteText(last)); };
  if (navigator.share) { $('shareBtn').hidden = false; $('shareBtn').onclick = function () { if (last) navigator.share({ text: inviteText(last) }).catch(function () {}); }; }

  $('bulkBtn').onclick = function () {
    var names = $('bulk').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!names.length) return;
    var hon = $('hon').value, i = 0, b = this; b.disabled = true;
    (function next() {
      if (i >= names.length) { $('bulkSt').textContent = 'បានបន្ថែម ' + names.length + ' នាក់ ✓'; $('bulk').value = ''; b.disabled = false; loadGuests(); return; }
      $('bulkSt').textContent = (i + 1) + '/' + names.length + '...';
      api('/api/guest', { op: 'add', hon: hon, name: names[i++] }).then(next, function () { b.disabled = false; $('bulkSt').textContent = 'ឈប់នៅលេខ ' + i; });
    })();
  };

  /* ---------- wishes ---------- */
  function loadWishes() {
    return api('/api/wishes?manage=1').then(function (d) {
      $('wBadge').textContent = d.pending.length || '';
      $('pCount').textContent = '(' + d.pending.length + ')'; $('lCount').textContent = '(' + d.live.length + ')';
      $('modNote').textContent = d.moderate ? '' : 'ការអនុម័តត្រូវបានបិទ (WISHES_MODERATION=off) — ពរថ្មីបង្ហាញភ្លាម';
      drawWishes($('pList'), d.pending, 'pending'); drawWishes($('lList'), d.live, 'live');
    }).catch(function () {});
  }
  function drawWishes(box, rows, from) {
    box.innerHTML = '';
    if (!rows.length) { box.appendChild(el('div', 'empty', 'គ្មាន')); return; }
    rows.forEach(function (w) {
      var it = el('div', 'wish');
      it.appendChild(el('div', 'n', w.name || 'ភ្ញៀវកិត្តិយស'));
      it.appendChild(el('div', 'm', w.msg));
      it.appendChild(el('div', 't', when(w.t)));
      var a = el('div', 'acts');
      function op(o) { return function () { api('/api/wishes', { op: o, id: w.id, from: from }).then(loadWishes).catch(function () {}); }; }
      if (from === 'pending') a.appendChild(btn('អនុម័ត', '', op('approve')));
      else a.appendChild(btn('លាក់វិញ', 'o', op('unapprove')));
      a.appendChild(btn('លុប', 'r', function () { if (confirm('លុបពរនេះ?')) op('del')(); }));
      it.appendChild(a); box.appendChild(it);
    });
  }

  if (KEY) start(); else route();
})();
</script>
</body>
</html>
